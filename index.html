<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مفاجأة شيماء ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* =========================
   خلفية الفيديو
========================= */

#bgVideo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-10;
    background:#16000e;
}

/* طبقة فوق الفيديو */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(15,0,12,.45);
    z-index:-5;
}

/* =========================
   الصفحة
========================= */

.page{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
}

.box{
    width:100%;
    max-width:500px;
    padding:30px 20px;
    text-align:center;
    border-radius:30px;

    background:rgba(0,0,0,.35);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 0 45px rgba(255,0,100,.4);
}

/* =========================
   العنوان
========================= */

h1{
    font-size:34px;
    color:#ff80b5;
    text-shadow:0 0 20px #ff0066;
    margin-bottom:10px;
}

.name{
    font-size:29px;
    margin:15px 0;
}

.date{
    font-size:20px;
    color:#ffc4da;
    margin-bottom:20px;
}

/* =========================
   العد التنازلي
========================= */

.countdown{
    display:flex;
    justify-content:center;
    gap:7px;
    margin:20px 0;
}

.time{
    min-width:65px;
    padding:10px 5px;
    border-radius:15px;
    background:rgba(255,255,255,.13);
}

.time span{
    display:block;
    font-size:25px;
    font-weight:bold;
    color:#ff8ab9;
}

.time small{
    font-size:11px;
}

/* =========================
   الهدية
========================= */

.gift{
    font-size:100px;
    cursor:pointer;
    display:inline-block;
    margin-top:10px;

    filter:drop-shadow(0 0 20px #ff0066);

    animation:bounce 1.2s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0) rotate(0);
    }

    50%{
        transform:translateY(-15px) rotate(5deg);
    }
}

.press{
    margin-top:5px;
    color:#ffd4e4;
}

/* =========================
   الرسائل
========================= */

.messages{
    display:none;
    animation:appear 1s ease;
}

.messages h2{
    font-size:30px;
    color:#ff80b5;
    margin-bottom:20px;
}

.message{
    min-height:160px;
    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
    line-height:1.9;
}

.next{
    border:none;
    padding:14px 30px;
    border-radius:30px;

    background:linear-gradient(
        45deg,
        #ff0066,
        #ff5b9d
    );

    color:white;
    font-size:17px;
    cursor:pointer;

    box-shadow:0 0 20px rgba(255,0,100,.5);
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   انفجار
========================= */

.explosion{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
}

.particle{
    position:absolute;
    left:50%;
    top:50%;
    font-size:25px;

    animation:explode 1.5s ease-out forwards;
}

@keyframes explode{

    from{
        transform:
        translate(-50%,-50%)
        scale(.3);

        opacity:1;
    }

    to{
        transform:
        translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
        )
        rotate(720deg)
        scale(1.5);

        opacity:0;
    }
}

/* =========================
   القلوب
========================= */

.heart{
    position:fixed;
    bottom:-30px;
    z-index:40;

    animation:heartUp linear forwards;
}

@keyframes heartUp{

    from{
        transform:
        translateY(0)
        rotate(0);

        opacity:1;
    }

    to{
        transform:
        translateY(-110vh)
        rotate(360deg);

        opacity:0;
    }
}
</style>
</head>

<body>

<!-- =========================
     الفيديو
========================= -->

<video
    id="bgVideo"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto">

    <source src="P1.mp4" type="video/mp4">

</video>

<div class="overlay"></div>


<!-- =========================
     الموسيقى
========================= -->

<audio id="music" loop preload="auto">
    <source src="P1.MP3" type="audio/mpeg">
</audio>


<div class="page">

<!-- الشاشة الأولى -->

<div class="box" id="main">

    <h1>🎂 مفاجأة صغيرة ❤️</h1>

    <div class="name">
        لشيماء ❤️
    </div>

    <div class="date">
        28 / 08 / 2026 🎉
    </div>


    <div class="countdown">

        <div class="time">
            <span id="days">00</span>
            <small>يوم</small>
        </div>

        <div class="time">
            <span id="hours">00</span>
            <small>ساعة</small>
        </div>

        <div class="time">
            <span id="minutes">00</span>
            <small>دقيقة</small>
        </div>

        <div class="time">
            <span id="seconds">00</span>
            <small>ثانية</small>
        </div>

    </div>


    <div
        class="gift"
        id="gift"
        onclick="openGift()">

        🎁

    </div>

    <div class="press">
        اضغطي على الهدية يا شيماء ❤️
    </div>

</div>


<!-- الرسائل -->

<div class="box messages" id="messages">

    <h2>💥 المفاجأة 💥</h2>

    <div
        class="message"
        id="message">
    </div>

    <button
        class="next"
        onclick="nextMessage()">

        💌 الرسالة التالية

    </button>

</div>

</div>


<script>

/* =========================
   تشغيل الفيديو
========================= */

const video =
document.getElementById("bgVideo");

video.muted = true;

video.setAttribute("muted","");

video.setAttribute("playsinline","");

video.play().catch(function(){

    /*
    إذا منع Safari التشغيل التلقائي،
    سيتم تشغيل الفيديو بعد أول لمس للشاشة.
    */

});

document.addEventListener(
    "touchstart",
    function(){

        video.play().catch(()=>{});

    },
    {once:true}
);


/* =========================
   العد التنازلي
========================= */

const target =
new Date("2026-08-28T00:00:00+01:00").getTime();

function countdown(){

    const now =
    new Date().getTime();

    const distance =
    target - now;


    if(distance <= 0){

        document.getElementById("days").innerHTML="00";
        document.getElementById("hours").innerHTML="00";
        document.getElementById("minutes").innerHTML="00";
        document.getElementById("seconds").innerHTML="00";

        return;
    }


    const days =
    Math.floor(
        distance /
        (1000*60*60*24)
    );


    const hours =
    Math.floor(
        (distance %
        (1000*60*60*24)) /
        (1000*60*60)
    );


    const minutes =
    Math.floor(
        (distance %
        (1000*60*60)) /
        (1000*60)
    );


    const seconds =
    Math.floor(
        (distance %
        (1000*60)) /
        1000
    );


    document.getElementById("days").innerHTML =
    String(days).padStart(2,"0");

    document.getElementById("hours").innerHTML =
    String(hours).padStart(2,"0");

    document.getElementById("minutes").innerHTML =
    String(minutes).padStart(2,"0");

    document.getElementById("seconds").innerHTML =
    String(seconds).padStart(2,"0");
}

countdown();

setInterval(countdown,1000);


/* =========================
   الرسائل
========================= */

const messages=[

"شيماء ❤️ اليوم ماشي نهار عادي... اليوم نهار ميلاد أجمل وحدة عرفتها 🥹",

"28/08 هو النهار لي تزادت فيه الإنسانة لي دخلت لقلبي وولات غالية عليا بزاف ❤️",

"عيد ميلاد سعيد يا روحي 🎂❤️ ربي يحفظك ويحققلك كل واش تتمني.",

"نتمنى ضحكتك تبقى ديما منورة حياتك، وما نشوفش الحزن في عينيك أبداً 🥹💕",

"نتمنى نبقى ديما سبب صغير في فرحتك ❤️",

"كل عام وانتي بخير يا شيماء 🌹 وإن شاء الله كل عام نحتافلو مع بعض.",

"نحبك بزاف ❤️ وما نقدرش نوصف بالكلام قدّاه نتي غالية عندي.",

"المفاجأة صغيرة... بصح الحب لي وراها كبير بزاف ❤️🥹",

"نتمنى عامك الجديد يكون أجمل عام في حياتك 🎂✨",

"عيد ميلاد سعيد لأغلى شيماء في الدنيا ❤️👑",

"❤️ نحبك يا شيماء ❤️"

];

let current=0;


/* =========================
   فتح الهدية
========================= */

function openGift(){

    const music =
    document.getElementById("music");


    /* تشغيل الموسيقى */

    music.volume=0.8;

    music.play().catch(function(){});


    /* منع الضغط مرة أخرى */

    document.getElementById("gift")
    .style.pointerEvents="none";


    /* انفجار */

    createExplosion();


    /* ظهور المفاجأة */

    setTimeout(function(){

        document.getElementById("main")
        .style.display="none";

        document.getElementById("messages")
        .style.display="block";

        showMessage();

        hearts();

    },1200);
}


/* =========================
   انفجار الهدية
========================= */

function createExplosion(){

    const explosion =
    document.createElement("div");

    explosion.className="explosion";


    const symbols=[
        "❤️",
        "💕",
        "💖",
        "💗",
        "💓",
        "✨",
        "💥",
        "🎉",
        "🌹",
        "💝"
    ];


    for(let i=0;i<70;i++){

        const p =
        document.createElement("div");

        p.className="particle";


        p.innerHTML =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


        const angle =
        Math.random() *
        Math.PI*2;


        const distance =
        150 +
        Math.random()*400;


        p.style.setProperty(
            "--x",
            Math.cos(angle)*
            distance+"px"
        );


        p.style.setProperty(
            "--y",
            Math.sin(angle)*
            distance+"px"
        );


        explosion.appendChild(p);
    }


    document.body.appendChild(explosion);


    setTimeout(function(){

        explosion.remove();

    },1800);
}


/* =========================
   عرض الرسالة
========================= */

function showMessage(){

    document.getElementById("message")
    .innerHTML=messages[current];
}


/* =========================
   الرسالة التالية
========================= */

function nextMessage(){

    current++;

    if(current>=messages.length){

        current=0;
    }


    const msg =
    document.getElementById("message");


    msg.style.opacity="0";


    setTimeout(function(){

        msg.innerHTML=
        messages[current];

        msg.style.opacity="1";

    },300);


    hearts();
}


/* =========================
   القلوب
========================= */

function hearts(){

    for(let i=0;i<20;i++){

        setTimeout(function(){

            const heart =
            document.createElement("div");

            heart.className="heart";


            const list=[
                "❤️",
                "💕",
                "💖",
                "💗",
                "💓",
                "💝"
            ];


            heart.innerHTML=
            list[
                Math.floor(
                    Math.random()*
                    list.length
                )
            ];


            heart.style.left=
            Math.random()*100+"vw";


            heart.style.fontSize=
            (18+
            Math.random()*25)+"px";


            heart.style.animationDuration=
            (3+
            Math.random()*4)+"s";


            document.body.appendChild(heart);


            setTimeout(function(){

                heart.remove();

            },7000);

        },i*100);
    }
}

</script>

</body>
</html>
