<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Glass Flip Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root{
  --glass: rgba(255,255,255,0.14);
  --border: rgba(255,255,255,0.25);
  --glow1: rgba(0,229,255,0.55);
  --glow2: rgba(255,0,150,0.45);
}

*{box-sizing:border-box;font-family:Poppins,sans-serif;margin:0;padding:0;}
body{
  height:100vh;
  background:#000; /* خلفية سوداء مضمونة */
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:1800px;
  overflow:hidden;
}
body{
  height:100vh;
  background:url("2552360924069428160.mp4") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:1800px;
  overflow:hidden;
}

body::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, var(--glow1), transparent 45%),
    radial-gradient(circle at 80% 80%, var(--glow2), transparent 50%);
  animation: glowMove 12s linear infinite;
  opacity:.35;
}

@keyframes glowMove{
  0%{filter:hue-rotate(0deg);}
  100%{filter:hue-rotate(360deg);}
}

.scene{
  width:360px;
  height:520px;
  position:relative;
}

.card{
  width:100%;
  height:100%;
  animation: float 7s ease-in-out infinite;
  position: relative;
}

.card-inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition: transform 1s cubic-bezier(.22,.61,.36,1);
  transform: rotateY(180deg); /* الخلفية أولًا */
}

.card-inner.flipped{
  transform: rotateY(0deg); /* الأمام بعد Flip */
}

.side{
  position:absolute;
  inset:0;
  background:var(--glass);
  backdrop-filter:blur(18px);
  border-radius:26px;
  border:1px solid var(--border);
  box-shadow:0 30px 65px rgba(0,0,0,.55),
             inset 0 0 30px rgba(255,255,255,.06);
  backface-visibility:hidden;
}

.front{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:45px 35px;
  color:white;
  transform:translateZ(0px);
}

.back{
  transform:rotateY(180deg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  padding:40px;
}

.avatar{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--border);
  box-shadow:0 0 35px var(--glow1);
  margin-bottom:18px;
}

h2{margin:10px 0 6px;font-weight:700;}
.role{font-size:14px;opacity:.85;text-align:center;line-height:1.5;margin-bottom:25px;}

.social{
  display:flex;
  gap:18px;
  margin-top:auto;
  align-items:center;
}

.social a{
  width:50px;
  height:50px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:20px;
  text-decoration:none;
  transition:.45s;
  box-shadow:0 0 15px transparent;
}

.social a:hover{
  background:white;
  color:black;
  transform:translateY(-6px) scale(1.15);
  box-shadow:0 0 30px var(--glow1);
}

.back h3{
  margin-bottom:15px;
}

.back p{
  font-size:14px;
  opacity:.9;
  text-align:center;
  line-height:1.6;
}

@keyframes float{
  0%{transform: translateY(0);}
  50%{transform: translateY(-18px);}
  100%{transform: translateY(0);}
}

/* Input و الزر */
.input-container{
  width:80%;
  display:flex;
  flex-direction:column;
  gap:15px;
  margin-top:20px;
}

.input-container input{
  padding:12px;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:16px;
  text-align:center;
  background:rgba(255,255,255,0.15);
  color:white;
  backdrop-filter:blur(10px);
}

.flip-btn{
  padding:12px;
  background:rgba(255,255,255,0.25);
  color:white;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:.3s;
}

.flip-btn:hover{
  background:white;
  color:black;
}
</style>
</head>
<body>

<div class="scene">
  <div class="card">
    <div class="card-inner" id="cardInner">

      <!-- FRONT -->
      <div class="side front">
        <img src="IMG_3713.jpeg" class="avatar">
        <h2>𝓑𝓡𝓐𝓗𝓘𝓜 𝓐𝓩𝓡𝓞𝓤𝓖</h2>
        <div class="role">

            
          </span> <!-- رمز الهاتف -->
        </div>
        <div class="social">
          <a href="tel:+123561550250" target="_blank">☏</a>
          <a href="https://www.instagram.com/brahim_az_27_?igsh=MXRieGt6czA2ZXBqeA%3D%3D&utm_source=qr" target="_blank"><i class="fab fa-instagram"></i></a>
          <a href="https://www.snapchat.com/@brahimaz27?invite_id=svVG1tbb&locale=fr_DZ&share_id=7oCYAFERRm-kX9ryD5qsoQ&sid=b460901e7b734b9fa0a6994569dd1b6d&locale=fr-FR" target="_blank"><i class="fab fa-snapchat-ghost"></i></a>

        <div class="input-container">
          <input type="text" id="nameInput" placeholder="Your Name">

  </div>
</div>

<!-- مشغل الموسيقى -->
<audio id="music" src="Cheb Houssem 2015 Ha Nay Nay Version Original éXcLù.mp4" preload="auto"></audio>

<script>
const cardInner = document.getElementById('cardInner');
const btn = document.getElementById('flipBtn');
const nameInput = document.getElementById('nameInput');

  } else {

</script>

</body>
</html>
